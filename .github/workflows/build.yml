name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test
        run: xvfb-run -a mvn -B -ntp clean verify

      - name: Upload update site
        uses: actions/upload-artifact@v4
        with:
          name: atom-material-icons-update-site
          path: releng/io.github.socra167.atommaterialicons.site/target/repository/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/*/target/surefire-reports/
